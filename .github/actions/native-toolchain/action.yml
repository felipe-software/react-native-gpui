name: Native toolchain
description: Rust, Zig 0.15.2, the Linux build packages and the pinned Ghostty source for rngpui-service.

inputs:
    cache-key:
        description: Extra key that separates this job's Cargo cache
        required: true

runs:
    using: composite
    steps:
        - name: Install Linux build packages
          if: runner.os == 'Linux'
          shell: bash
          run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                libjavascriptcoregtk-4.1-dev libxkbcommon-x11-dev libasound2-dev \
                libfontconfig-dev libfreetype-dev pkg-config

        - name: Setup Rust
          uses: dtolnay/rust-toolchain@stable

        - name: Setup Zig
          uses: mlugg/setup-zig@v2
          with:
              version: 0.15.2

        - name: Build Zig code for the baseline CPU
          shell: bash
          run: |
              wrapper_dir="$RUNNER_TEMP/zig-baseline"
              mkdir -p "$wrapper_dir"
              real_zig="$(command -v zig)"
              printf '#!/bin/sh\nif [ "$1" = build ]; then shift; exec "%s" build -Dcpu=baseline "$@"; fi\nexec "%s" "$@"\n' "$real_zig" "$real_zig" > "$wrapper_dir/zig"
              chmod +x "$wrapper_dir/zig"
              echo "$wrapper_dir" >> "$GITHUB_PATH"

        - name: Cache Cargo
          uses: Swatinem/rust-cache@v2
          with:
              workspaces: rust -> target
              key: ${{ inputs.cache-key }}-zig-baseline

        - name: Cache the Ghostty source
          uses: actions/cache@v4
          with:
              path: ~/.cache/rngpui
              key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}

        - name: Check out the pinned Ghostty source
          shell: bash
          run: echo "GHOSTTY_SOURCE_DIR=$(node ts/scripts/ghostty-source.mjs)" >> "$GITHUB_ENV"
