name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    typescript:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: ts
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm run test:unit

    rust:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  package-manager-cache: false

            - name: Setup the native toolchain
              uses: ./.github/actions/native-toolchain
              with:
                  cache-key: test

            - name: cargo test
              working-directory: rust
              run: cargo test
